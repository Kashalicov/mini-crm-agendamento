{% extends "base.html" %}
{% block title %}Novo Agendamento{% endblock %}
{% block content %}
<h1>Novo Agendamento</h1>

<form method="post">
    <div class="mb-3">
        <label class="form-label">Cliente *</label>
        <select name="cliente_id" class="form-select" required>
            <option value="" disabled selected>Selecione um cliente</option>
            {% for cliente in clientes %}
            <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Título *</label>
        <input type="text" name="titulo" class="form-control" required placeholder="Ex: Reunião de alinhamento">
    </div>
    <div class="mb-3">
        <label class="form-label">Data e hora *</label>
        <input type="datetime-local" name="data_hora" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Agendar</button>
    <a href="{{ url_for('listar_agendamentos') }}" class="btn btn-link">Cancelar</a>
</form>
{% endblock %}
